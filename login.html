<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | NubaGlow App</title>
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%2232%22><text y=%2226%22 font-size=%2226%22>✨</text></svg>">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            roseQuartz: '#F4C2C2',
            roseGold: '#E8A5A5',
            roseDeep: '#C97A7E',
            roseDark: '#8F3E43',
            nudeCream: '#FFF8F5',
            nudeSoft: '#FDF6F0',
            glowGold: '#E6C387',
            champagne: '#F5E5C9',
            neutralDark: '#222222'
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Estilos del Sistema de Diseño NubaGlow -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#FFF8F5] text-neutral-800 antialiased selection:bg-[#F4C2C2] selection:text-neutral-900 relative min-h-screen flex flex-col justify-between">

  <!-- Destellos suaves de fondo -->
  <div class="glow-blob-1 top-0 left-[-100px]"></div>
  <div class="glow-blob-2 bottom-0 right-[-100px]"></div>

  <!-- Header simplificado con Logo Glow -->
  <header class="py-6 px-6 relative z-10">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5 group">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-[#E8A5A5] via-[#F4C2C2] to-[#E6C387] p-0.5 shadow-md">
          <div class="w-full h-full bg-white rounded-[14px] flex items-center justify-center">
            <svg class="w-5 h-5 text-[#C97A7E] animate-sparkle" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2L14.2 8.8L21 11L14.2 13.2L12 20L9.8 13.2L3 11L9.8 8.8L12 2Z"></path>
            </svg>
          </div>
        </div>
        <div>
          <span class="text-xl font-extrabold text-neutral-900 tracking-tight">Nuba<span class="text-[#C97A7E]">Glow</span></span>
          <span class="text-[10px] font-bold px-1.5 py-0.5 rounded-full badge-gold uppercase ml-1">Seguridad</span>
        </div>
      </a>

      <a href="index.html" class="text-xs font-bold text-neutral-600 hover:text-[#8F3E43] flex items-center gap-1">
        <span>← Volver a la Tienda</span>
      </a>
    </div>
  </header>

  <!-- Contenedor Principal del Login -->
  <main class="flex-1 flex items-center justify-center px-4 py-8 relative z-10">
    <div class="glass-panel w-full max-w-md p-8 sm:p-10 rounded-3xl border border-rose-200 shadow-2xl animate-scale-in">
      
      <!-- Título e Introducción -->
      <div class="text-center mb-8">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-[#F4C2C2] via-[#E8A5A5] to-[#E6C387] mx-auto flex items-center justify-center shadow-md mb-3 text-2xl">
          ✨
        </div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-neutral-900 tracking-tight">Iniciar Sesión</h1>
        <p class="text-xs text-neutral-500 mt-2">
          Ingresa al sistema NubaGlow con tu rol asignado (RBAC)
        </p>
      </div>

      <!-- Mensaje de Alerta / Error -->
      <div id="login-error" class="hidden mb-5 p-3.5 rounded-2xl bg-red-50 border border-red-200 text-xs text-red-700 font-semibold flex items-center gap-2">
        <span>⚠️</span>
        <span id="login-error-msg">Credenciales incorrectas</span>
      </div>

      <!-- Formulario de Acceso -->
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-neutral-700 uppercase tracking-wider mb-1.5">Correo Electrónico</label>
          <input 
            type="email" 
            id="email-input" 
            required 
            placeholder="admin@nuba.bo" 
            class="input-glow w-full"
            value="admin@nuba.bo"
          >
        </div>

        <div>
          <label class="block text-xs font-bold text-neutral-700 uppercase tracking-wider mb-1.5">Contraseña</label>
          <input 
            type="password" 
            id="password-input" 
            required 
            placeholder="••••••••" 
            class="input-glow w-full"
            value="admin1234"
          >
        </div>

        <button 
          type="submit" 
          id="submit-btn" 
          class="w-full btn-rose-primary py-3.5 rounded-2xl text-sm font-bold shadow-md hover:shadow-xl transition-all flex items-center justify-center gap-2 mt-2">
          <span>Entrar al Sistema</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
          </svg>
        </button>
      </form>

      <!-- Selector de Cuentas Demo para Prueba Rápida -->
      <div class="mt-8 pt-6 border-t border-rose-100">
        <span class="block text-center text-[11px] font-bold text-neutral-500 uppercase tracking-wider mb-3">
          ⚡ Prueba Rápida de Roles (Demostración)
        </span>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <button type="button" onclick="seleccionarDemo('admin@nuba.bo', 'admin1234')" class="p-2 rounded-xl bg-white hover:bg-rose-50 border border-rose-200 text-left transition shadow-sm">
            <strong class="block text-neutral-800 text-[11px]">👑 Admin</strong>
            <span class="text-[10px] text-neutral-500">Gestión total</span>
          </button>
          <button type="button" onclick="seleccionarDemo('vendedor@nuba.bo', 'vendedor1234')" class="p-2 rounded-xl bg-white hover:bg-rose-50 border border-rose-200 text-left transition shadow-sm">
            <strong class="block text-neutral-800 text-[11px]">🛍️ Vendedor</strong>
            <span class="text-[10px] text-neutral-500">Punto de Venta</span>
          </button>
          <button type="button" onclick="seleccionarDemo('almacen@nuba.bo', 'almacen1234')" class="p-2 rounded-xl bg-white hover:bg-rose-50 border border-rose-200 text-left transition shadow-sm">
            <strong class="block text-neutral-800 text-[11px]">📦 Almacén</strong>
            <span class="text-[10px] text-neutral-500">Inventario y stock</span>
          </button>
          <button type="button" onclick="seleccionarDemo('logistica@nuba.bo', 'logistica1234')" class="p-2 rounded-xl bg-white hover:bg-rose-50 border border-rose-200 text-left transition shadow-sm">
            <strong class="block text-neutral-800 text-[11px]">🚚 Logística</strong>
            <span class="text-[10px] text-neutral-500">Trazabilidad</span>
          </button>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer simple -->
  <footer class="py-4 text-center text-xs text-neutral-400 relative z-10">
    <p>© 2026 NubaGlow App • Módulo de Seguridad y Control de Acceso (Ingeniería de Software)</p>
  </footer>

  <!-- Scripts -->
  <script src="js/auth.js"></script>
  <script>
    function seleccionarDemo(email, pass) {
      document.getElementById('email-input').value = email;
      document.getElementById('password-input').value = pass;
      document.getElementById('login-error').classList.add('hidden');
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email-input').value;
      const pass = document.getElementById('password-input').value;
      const errorBox = document.getElementById('login-error');
      const errorMsg = document.getElementById('login-error-msg');
      const submitBtn = document.getElementById('submit-btn');

      errorBox.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span>Verificando...</span>`;

      try {
        const resultado = await iniciarSesion(email, pass);
        // Redirigir según el rol del usuario
        const destino = RUTA_POR_ROL[resultado.usuario.rol] || 'index.html';
        window.location.href = destino;
      } catch (err) {
        errorMsg.textContent = err.message || "Error al iniciar sesión";
        errorBox.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Entrar al Sistema</span>`;
      }
    });
  </script>
</body>
</html>
